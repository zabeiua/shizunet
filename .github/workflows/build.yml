name: Android Build Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger directly from GitHub Web Interface

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # High performance Zulu OpenJDK
        java-version: '17'
        cache: 'gradle' # Automatically cache Gradle dependencies between runs

    - name: Grant Execute Permissions for Gradlew
      run: chmod +x gradlew
      continue-on-error: true # Safe fallback if custom directory maps are adjusted

    - name: Assemble Debug Package with Gradle
      run: ./gradlew assembleDebug

    - name: Upload Compiled Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShizuNet-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
        retention-days: 7 # Safe resource allocation
